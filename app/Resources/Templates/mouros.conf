# rme-split channel layout config
# Edit this file to change channel routing and output filenames.
#
# Format:  CHANNELS    OUTPUT_NAME
#   CHANNELS:    single number = mono, N-M = stereo pair (0-indexed)
#   OUTPUT_NAME: output filename without .wav (spaces allowed)
#
# Lines starting with # and blank lines are ignored.
# HW inputs: VOX G (0), VOX L (1)
# HW outputs: 12 OUT VOX (2-3), 34 OUT SYNT (4-5), 56 OUT BT (6-7)
#             8 PH L / 9 PH LUIS: NOT armed
# Loopback:   REC GUI FX (8-9), REC BASS (10), REC DRM (11),
#             REC LD (12), REC TELE (13), REC MF (14-15),
#             REC PB (16-17), REC FX (18-19)

0-1     01_out_vox
2-3     03_out_bt
4-5     04_gui_fx
6      05_bass
7      06_drm
8      07_ld
9      08_tele
10-11   09_mf
12-13   10_pb