# rme-split channel layout config
# Edit this file to change channel routing and output filenames.
#
# Format:  CHANNELS    OUTPUT_NAME
#   CHANNELS:    single number = mono, N-M = stereo pair (0-indexed)
#   OUTPUT_NAME: output filename without .wav (spaces allowed)
#
# Lines starting with # and blank lines are ignored.
# Snapshot: Docs/ufx.png (26 channels)
# HW inputs:  1 VOX G (0), 10 VOX L (1)
#             AN 2, 34 MINIFREA, 5 MOOG, 6 DRM, 7 LEAD, 8 TELEPATHY, 9,
#             INTRO: NOT armed
# HW outputs: 12 VOXGUI (2-3), 34 VOX L (4-5), 56 BASS (6-7),
#             78 DRM (8-9), 910 LEAD (10-11), 1112 TELE (12-13),
#             1314 MF (14-15), 1516 MST (16-17), 1718 REV (18-19),
#             1920 DLY (20-21), 2122 INTRO (22-23), MA 23/24 ST (24-25)
#             AN 1/2, GUI PH, MONITOR, AN 7/8, PH 910 LUIS, PH 11/12,
#             MA 25/26, MA 27/28: NOT armed

2-3     01_vox_gui
4-5     02_vox_luis
6-7     03_bass
8-9     04_drm
10-11   05_lead
12-13   06_tele
14-15   07_mf
16-17   08_mst
18-19   09_rev
20-21   10_dly
22-23   11_intro
24-25   12_st
0       13_in_g
